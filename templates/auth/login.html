{% extends "base.html" %}{% block title %}Login - SMARTGHAR AI{% endblock %}
{% block content %}<div class="auth card"><h2 class="serif">Welcome back</h2>
<form method="post"><label>Email</label><input type="email" name="email" required autofocus>
<label>Password</label><input type="password" name="password" required>
<label style="font-weight:400"><input type="checkbox" name="remember" style="width:auto"> Remember me</label>
<button class="btn gold" style="width:100%;margin-top:16px;justify-content:center">Login</button></form>
<p style="font-size:14px">New here? <a href="{{ url_for('auth.register') }}">Create an account</a></p></div>{% endblock %}
