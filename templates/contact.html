{% extends "base.html" %}{% block title %}Contact - SMARTGHAR AI{% endblock %}
{% block content %}<section class="s"><div class="container grid g2"><div><div class="kicker">Contact us</div><h2>Let's talk</h2><p>{{ site.contact_email }}<br>{{ site.contact_phone }}<br>{{ site.contact_address }}</p></div>
<form method="post" class="card"><label>Name</label><input name="name" required><label>Email</label><input type="email" name="email" required><label>Message</label><textarea name="message" rows="5" required></textarea><button class="btn gold" style="margin-top:14px">Send message</button></form></div></section>{% endblock %}
