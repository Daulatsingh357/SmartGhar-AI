{% extends "admin/base.html" %}{% block admin %}<div class="card"><form method="get" style="display:flex;gap:8px;align-items:end;max-width:420px"><div style="flex:1"><label>City</label><input name="city" list="cl" value="{{ city }}"><datalist id="cl">{% for c in cities %}<option>{{ c }}</option>{% endfor %}</datalist></div><button class="btn">Load</button></form>
<form method="post"><input type="hidden" name="city" value="{{ city }}"><table class="t" style="margin-top:16px"><tr><th>Item</th><th>Unit</th><th>Price (INR)</th></tr>{% for k,p in prices.items() %}<tr><td>{{ p.label }}</td><td>{{ p.unit }}</td><td><input name="{{ k }}" type="number" step="any" min="0" value="{{ p.price }}" style="max-width:150px"></td></tr>{% endfor %}</table><button class="btn gold" style="margin-top:14px">Save prices for {{ city }}</button></form></div>{% endblock %}
