{% extends "admin/base.html" %}{% block admin %}<div class="card" style="overflow:auto"><table class="t"><tr><th>ID</th><th>Project</th><th>Owner</th><th>Updated</th><th></th></tr>
{% for p,u in rows %}<tr><td>{{ p.id }}</td><td><a href="{{ url_for('pages.studio', pid=p.id) }}">{{ p.name }}</a></td><td>{{ u.email }}</td><td>{{ p.updated_at.strftime('%d %b %Y') }}</td><td><form method="post"><input type="hidden" name="id" value="{{ p.id }}"><button class="btn sm danger" onclick="return confirm('Delete project?')">Delete</button></form></td></tr>{% endfor %}</table></div>{% endblock %}
