{% extends "admin/base.html" %}{% block admin %}<div class="card"><table class="t"><tr><th>User</th><th>Plan</th><th>Status</th><th>Started</th><th>Ends</th></tr>{% for s,u in rows %}<tr><td>{{ u.email }}</td><td><span class="tag">{{ s.plan }}</span></td><td>{{ s.status }}</td><td>{{ s.started_at.strftime('%d %b %Y') }}</td><td>{{ s.ends_at.strftime('%d %b %Y') if s.ends_at else '-' }}</td></tr>{% else %}<tr><td colspan="5" class="sub">No subscription records yet.</td></tr>{% endfor %}</table></div>{% endblock %}
